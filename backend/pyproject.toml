[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for Interview Canvas"
readme = "README.md"
authors = [
    { name = "nextgendevlabs-a11y", email = "nextgendevlabs@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
backend = "backend.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
